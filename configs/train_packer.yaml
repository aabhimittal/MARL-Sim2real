# PPO hyperparameters for the Packer agent, plus the alternating-training schedule
# shared by both agents (read once by training/train.py).

schedule:
  n_rounds: 4                  # alternating rounds: packer round, physics round, packer round, ...
  timesteps_per_round: 4096    # full-scale timesteps per agent per round
  smoke_timesteps_per_round: 256   # used by scripts/run_smoke_train.sh for fast CI verification

ppo:
  policy: "MultiInputPolicy"   # obs is a Dict space (heightmap + next_item)
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  seed: 42
