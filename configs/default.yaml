# Default configuration for the marl_sim2real package — every value mirrors
# marl_sim2real/config.py. Override any subset; unspecified keys keep their
# code defaults.
#
# The src/marl_packing MLOps track is configured by the other YAML files in
# this directory (env.yaml, train_packer.yaml, train_physics.yaml,
# challenger_eval.yaml).

packing:
  bin_size: [10, 10, 10]
  cell_size: 0.05
  max_items: 12
  min_item_dim: 2
  max_item_dim: 5

# Industrial constraint envs take these as constructor kwargs (they are not
# part of PackingConfig): ConstrainedPackingEnv(fragile_fraction, mass_range,
# fragile_max_load), DeliveryPackingEnv(num_stops), MultiBinPackingEnv(max_bins).
# Documented defaults:
#   fragile_fraction: 0.3      # share of items with a finite load rating
#   mass_range: [0.5, 3.0]     # item mass, distributed onto supporters
#   fragile_max_load: 2.0      # rating of fragile items
#   num_stops: 3               # delivery stops for the LIFO unload constraint
#   max_bins: 6                # pallet budget before items are diverted

physics:
  gravity: -9.81
  sim_steps: 120
  timestep: 0.004166667
  max_displacement: 0.02
  max_tilt_deg: 10.0

train:
  episodes: 200
  lr: 0.0003
  gamma: 0.99
  entropy_coef: 0.01
  seed: 7

gnn:
  hidden_dim: 64
  num_layers: 3
  lr: 0.001
  node_feat_dim: 4
  edge_feat_dim: 3

drift:
  k_sigma: 3.0          # trigger threshold: |real - sim_mean| > k * sim_std
  window_size: 30
  min_samples: 10
  recalib_steps: 50
  bias_lr: 0.1
  ema_alpha: 0.2

router:
  low_threshold: 0.33
  high_threshold: 0.66
