# Reference of every tunable in the project, mirroring the dataclass /
# constructor defaults in code. This file is documentation: the scripts take
# CLI flags, and library users pass these values to the constructors directly.

env:                      # marl_packing.envs.PackingConfig
  bin_size: [10, 10, 10]  # (W, D, H) voxel grid
  num_boxes: 20           # boxes per episode
  min_box: 1              # min box edge length (voxels)
  max_box: 4              # max box edge length (voxels)
  lookahead: 3            # upcoming boxes visible to the proposer
  reward_volume_scale: 10.0
  penalty_invalid: -1.0   # out-of-bounds / over-height proposal
  penalty_veto: -0.5      # Physics Agent rejected the placement
  penalty_unstable: -2.0  # committed placement collapsed in the settle test

proposer:                 # marl_packing.agents.ProposerAgent
  hidden: 128             # width of the two policy hidden layers
  lr: 0.003

physics:                  # marl_packing.agents.PhysicsAgent
  veto_threshold: 0.25    # veto when rules fail AND critic confidence < this
  use_pybullet: false     # requires `pip install pybullet`
  lr: 0.01

trainer:                  # marl_packing.training.TrainerConfig
  episodes: 200
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2           # PPO clipped-surrogate epsilon
  update_epochs: 4
  minibatch_size: 64
  entropy_coef: 0.01
  log_every: 10

randomization:            # marl_packing.sim2real.RandomizationConfig
  dim_tolerance: 0.15     # P(a box edge is measured +-1 voxel off)
  placement_jitter: 0.1   # P(the commit lands 1 cell off target)
  obs_noise_std: 0.2      # gaussian noise on heightmap readings
  support_shift_std: 0.05 # perturbation of stability thresholds

bridge:                   # marl_packing.sim2real.Sim2RealBridge
  max_retries: 3          # actions tried per box before diverting it

semantic_cache:           # semantic_cache.SemanticCache
  max_chunks: 5000        # working-set bound before score-based eviction
  chunk_size: 120         # words per chunk
  overlap: 20             # words shared between adjacent chunks
  semantic_edge_threshold: 0.45  # min cosine to wire a semantic edge
  semantic_edge_k: 3      # nearest neighbors considered per new chunk
  alpha: 0.6              # fusion weight: alpha*cosine + (1-alpha)*activation
  retriever:
    seed_k: 5             # vector hits used as activation seeds
    hops: 2               # spreading-activation rounds
    decay: 0.5            # energy decay per hop
