# PPO hyperparameters for the Physics ("stability") agent.
# Discrete accept/reject action space -> same MultiInputPolicy family, smaller network is plenty.

ppo:
  policy: "MultiInputPolicy"
  learning_rate: 3.0e-4
  n_steps: 256
  batch_size: 64
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  seed: 42

reward_shaping:
  false_accept_penalty: -1.0    # accepted a placement that then collapsed
  false_reject_penalty: -0.3    # rejected a placement that would have been stable
  correct_decision_reward: 0.2
