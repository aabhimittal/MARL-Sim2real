# Packing environment configuration.
# Units: meters, kilograms, seconds unless noted.

bin_dims: [1.0, 1.0, 1.0]        # interior bin size (x, y, z)
grid_resolution: 0.05             # heightmap cell size -> grid shape (20, 20) for a 1.0m bin
num_items_per_episode: 8
item_size_range:                  # [min, max] per axis, sampled per item
  x: [0.10, 0.30]
  y: [0.10, 0.30]
  z: [0.10, 0.30]

# PyBullet drop-simulation parameters
gravity: -9.81
sim_hz: 240                       # physics steps per second
settle_timeout_steps: 240         # max sim steps to wait for the dropped box to settle
settle_lin_vel_thresh: 0.01       # m/s, below this (+ang vel thresh) for settle_hold_steps -> "settled"
settle_ang_vel_thresh: 0.05       # rad/s
settle_hold_steps: 10

# Stability failure thresholds, measured after settling
tilt_fail_deg: 15.0                # box (or any existing box it disturbed) tilted more than this -> unstable
displacement_fail_m: 0.04          # any existing box displaced more than this -> unstable

domain_randomization:
  train:
    friction_range: [0.4, 0.8]
    mass_scale_range: [0.9, 1.1]
    restitution_range: [0.0, 0.1]
    pose_noise_m: 0.0
  real_proxy:                      # wider range standing in for unmodeled real-world variation
    friction_range: [0.2, 1.0]
    mass_scale_range: [0.7, 1.4]
    restitution_range: [0.0, 0.3]
    pose_noise_m: 0.01

seed: 42
