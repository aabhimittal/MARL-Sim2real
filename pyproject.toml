[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-sim2real"
version = "0.2.0"
description = "MARL bin packing with a Physics Agent stability critic, dynamic GNN path optimization, sim2real drift self-correction, and a vector-graph semantic cache"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
    "torch>=2.2",
    "pybullet>=3.2",
    "networkx>=3.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["marl_sim2real*", "marl_packing*", "semantic_cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
