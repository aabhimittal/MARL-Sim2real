[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marl-sim2real"
version = "0.1.0"
description = "Multi-Agent RL bin packing with a Physics Agent stability critic, a Sim2Real bridge, and a vector-graph hybrid semantic cache for ultra-long contexts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
physics = ["pybullet>=3.2"]
dev = ["pytest>=7.0", "pytest-cov"]

[tool.setuptools.packages.find]
include = ["marl_packing*", "semantic_cache*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
