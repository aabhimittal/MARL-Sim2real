name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest tests -v

  smoke-pipeline:
    needs: lint-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install -e .

      - name: Smoke-train a model and register it
        id: smoke_train
        run: |
          VERSION_ID=$(bash scripts/run_smoke_train.sh | tail -n 1)
          echo "Registered challenger version: $VERSION_ID"
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: Evaluate challenger against promotion gate
        run: bash scripts/run_challenger_eval.sh "${{ steps.smoke_train.outputs.version_id }}"

      - name: Smoke-test marl_sim2real end-to-end pipeline
        run: python scripts/run_pipeline.py
